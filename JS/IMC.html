<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cálculo do IMC</title>
</head>
<body>
    <form id="imcForm" onsubmit="calcularIMC(event);">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.1" required><br><br>
        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" name="altura" step="0.01" required><br><br>
        <input type="submit" value="Calcular IMC">
    </form>
    <div id="resultadoIMC"></div>

    <script>
        function calcularIMC(event) {
            event.preventDefault();
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);
            let imc = peso / (altura * altura);
            let classificacao = "";

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 24.9) {
                classificacao = "Peso normal";
            } else if (imc < 29.9) {
                classificacao = "Sobrepeso";
            } else {
                classificacao = "Obesidade";
            }

            document.getElementById("resultadoIMC").innerText = `Seu IMC é ${imc.toFixed(2)}: ${classificacao}`;
        }
    </script>
</body>
</html>
