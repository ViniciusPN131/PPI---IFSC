<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nome Completo</title>
</head>
<body>
    <script>
        let nomeCompleto = prompt("Qual é o seu nome completo?");
        nomeCompletoUp = nomeCompleto.toUpperCase();
        nomeCompletoLow = nomeCompleto.toLowerCase();
        nomeLenght = nomeCompleto.length;
        alert('Nome em maiúsculas: ' + nomeCompletoUp + '\nNome em minúsculas: '+ nomeCompletoLow +'\nQuantidade de caracteres: '+nomeLenght);
        console.log(`Nome em maiúsculas: ${nomeCompleto.toUpperCase()}`);
        console.log(`Nome em minúsculas: ${nomeCompleto.toLowerCase()}`);
        console.log(`Quantidade de caracteres: ${nomeCompleto.length}`);
    </script>
</body>
</html>
