<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Par ou Ímpar</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("Digite um número:"));
        let resultado = (numero % 2 === 0) ? "par" : "ímpar";
        alert(`O número ${numero} é ${resultado}.`);
    </script>
</body>
</html>
