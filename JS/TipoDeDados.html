<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tipos de Dados</title>
</head>
<body>
    <script>
        let nome = "João"; // String
        let idade = 30; // Número
        let ativo = true; // Booleano
        let frutas = ["maçã", "banana", "laranja"]; // Array
        let pessoa = { nome: "Maria", idade: 25 }; // Objeto

        function tipoDeDado(variable) {
            return typeof variable;
        }

        console.log(tipoDeDado(nome));
        console.log(tipoDeDado(idade));
        console.log(tipoDeDado(ativo));
        console.log(tipoDeDado(frutas));
        console.log(tipoDeDado(pessoa));
    </script>
</body>
</html>
