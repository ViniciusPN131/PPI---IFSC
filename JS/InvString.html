<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Inverter String</title>
</head>
<body>
    <script>
        function inverterString(str) {
            return str.split('').reverse().join('');
        }
        console.log(inverterString("exemplo"));
    </script>
</body>
</html>
