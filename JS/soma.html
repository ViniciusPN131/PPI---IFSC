<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Soma de Números</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("Digite o primeiro número (A):"));
        let b = parseFloat(prompt("Digite o segundo número (B):"));
        alert(`A soma de A e B é: ${a + b}`);
    </script>
</body>
</html>
